<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3-Line Link Shortener</title>
  <style>
    body { font-family: sans-serif; max-width: 500px; margin: 50px auto; padding: 20px; background: #f4f4f9; }
    input, button { width: 100%; padding: 12px; margin: 8px 0; border-radius: 6px; border: 1px solid #ccc; box-sizing: border-box; }
    button { background: #2ea44f; color: white; font-weight: bold; border: none; cursor: pointer; }
    button:hover { background: #2c974b; }
    #output { background: #fff; padding: 15px; border-radius: 6px; border: 1px solid #ddd; margin-top: 15px; font-family: monospace; white-space: pre; overflow-x: auto; line-height: 1.6; }
  </style>
</head>
<body>

  <h2>3-Line Link Shortener</h2>
  <input type="text" id="longUrl" placeholder="Apna lamba link yahan paste karein..." />
  <button onclick="processLink()">Short Karein (Exact 3 Lines)</button>
  
  <div id="output">Yahan 3 lines mein result aayega...</div>
  <button onclick="copyResult()" style="background:#0366d6;">Copy Result</button>

  <script>
    async function processLink() {
      const urlInput = document.getElementById('longUrl').value.trim();
      const output = document.getElementById('output');
      
      if (!urlInput) {
        output.innerText = "Pehle koi link paste karein!";
        return;
      }

      output.innerText = "Processing...";

      try {
        // Step 1: TinyURL API se link short karna
        const res = await fetch(`https://tinyurl.com/api-create.php?url=${encodeURIComponent(urlInput)}`);
        const shortUrl = await res.text();

        // Step 2: Short link ko theek 3 barabar hisson (lines) mein todna
        const partSize = Math.ceil(shortUrl.length / 3);
        const line1 = shortUrl.slice(0, partSize);
        const line2 = shortUrl.slice(partSize, partSize * 2);
        const line3 = shortUrl.slice(partSize * 2);

        // Exact 3 lines output (na kam, na zyada)
        output.innerText = `${line1}\n${line2}\n${line3}`;
      } catch (error) {
        output.innerText = "Error: Link short nahi ho saka.";
      }
    }

    function copyResult() {
      const text = document.getElementById('output').innerText;
      navigator.clipboard.writeText(text);
      alert("3-Line link copy ho gaya hai!");
    }
  </script>

</body>
</html>
